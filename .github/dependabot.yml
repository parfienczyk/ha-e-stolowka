# Trzyma wersje akcji i zależności testowych aktualne bez ręcznego pilnowania.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: ["zależności"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    labels: ["zależności"]
