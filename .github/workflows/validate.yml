name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Check „brands" wymaga, by domena istniała w repozytorium
          # home-assistant/brands (katalog custom_integrations/e_stolowka).
          # Obrazy w custom_components/e_stolowka/brand/ tego nie zastępują —
          # HACS ich nie widzi. Usuń to pominięcie, gdy PR do
          # home-assistant/brands zostanie scalony.
          ignore: brands

  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 to minimum Home Assistanta 2026.2, 3.14 wymagają wydania 2026.9+.
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-test.txt
      - run: pytest tests/ -q

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check .

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install bandit
      # -ll: średni i wysoki poziom. Testy pomijamy — mają atrapy tokenów.
      - run: bandit -r custom_components scripts -ll

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          # Konto osobiste nie wymaga GITLEAKS_LICENSE. Przy przeniesieniu
          # repozytorium do organizacji skan padnie z prośbą o klucz.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  home-assistant:
    name: import (Home Assistant)
    # Instalacja HA jest ciężka, a psuje się głównie przy nowym wydaniu,
    # nie przy każdym commicie. Parser i tak jest sprawdzany w pytest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.14, bo bieżące wydania HA (2026.9+) już nie wstają na 3.13.
          python-version: "3.14"
      - run: pip install homeassistant
      - run: python -c "import custom_components.e_stolowka"
