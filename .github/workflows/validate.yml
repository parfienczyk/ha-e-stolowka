name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # Check „brands" wymaga, by domena istniała w repozytorium
          # home-assistant/brands (katalog custom_integrations/e_stolowka).
          # Obrazy w custom_components/e_stolowka/brand/ tego nie zastępują —
          # HACS ich nie widzi. Usuń to pominięcie, gdy PR do
          # home-assistant/brands zostanie scalony.
          ignore: brands

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: pytest tests/ -q

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format --check .
